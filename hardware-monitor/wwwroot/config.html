<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hardware Monitor · Configuration</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a212b;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #2a3441;
      --accent: #4ea1ff;
      --ok: #5fd38d;
      --err: #ff7a59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
    .nav { margin-bottom: 20px; }
    .nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .nav a:hover { text-decoration: underline; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      max-width: 420px;
    }
    .panel p.intro { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field .unit { color: var(--muted); font-weight: 400; }
    input[type="number"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: default; }
    .status { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
  </style>
</head>
<body>
  <h1>Configuration</h1>
  <div class="nav"><a href="/">&larr; Back to dashboard</a></div>

  <div class="panel">
    <p class="intro">
      Set the temperature alert limits sent to the display. When you save, the new limits are stored
      and pushed to the display immediately.
    </p>

    <form id="form">
      <div class="field">
        <label for="cpu">CPU temperature limit <span class="unit">(°C)</span></label>
        <input type="number" id="cpu" min="30" max="120" step="1" required />
      </div>
      <div class="field">
        <label for="gpu">GPU temperature limit <span class="unit">(°C)</span></label>
        <input type="number" id="gpu" min="30" max="120" step="1" required />
      </div>
      <button type="submit" id="save">Save</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const cpuEl = document.getElementById('cpu');
    const gpuEl = document.getElementById('gpu');
    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save');

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    async function load() {
      try {
        const res = await fetch('/api/config/thresholds');
        if (!res.ok) throw new Error('request failed');
        const data = await res.json();
        cpuEl.value = data.cpu;
        gpuEl.value = data.gpu;
      } catch (err) {
        setStatus('Could not load current thresholds: ' + err.message, 'err');
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      setStatus('Saving…');
      try {
        const res = await fetch('/api/config/thresholds', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cpu: Number(cpuEl.value), gpu: Number(gpuEl.value) })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'request failed');
        setStatus(
          data.sent
            ? `Saved. Sent to display: CPU ${data.cpu}°C, GPU ${data.gpu}°C.`
            : `Saved CPU ${data.cpu}°C, GPU ${data.gpu}°C — but no display is connected, so nothing was sent.`,
          data.sent ? 'ok' : 'err'
        );
      } catch (err) {
        setStatus('Save failed: ' + err.message, 'err');
      } finally {
        saveBtn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
